<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover + user-scalable=no: กันการซูมพลาดตอนพนักงานกดรัว -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#b8562f" />
    <!-- ให้เปิดเต็มจอเมื่อติดตั้งลงหน้าจอโฮม
         ต้องใส่ทั้งสองตัว: ตัวมาตรฐานสำหรับ Chrome/Android
         และตัวของ Apple ที่ Safari ยังต้องใช้อยู่ -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrakaiPOS" />
    <title>PrakaiPOS — หน้าขาย</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
