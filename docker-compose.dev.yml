# ชุดพัฒนาเต็ม — PocketBase + 3 แอปหน้าเว็บ พร้อม hot reload ในคำสั่งเดียว
#
#   npm run dev:up      — เปิดทั้งหมด ติด log ไว้หน้าจอ (Ctrl+C ปิด)
#   npm run dev:up:d    — เปิดแบบพื้นหลัง
#   npm run dev:down    — ปิด
#   npm run dev:logs    — ดู log
#
# หน้าเว็บ: POS http://localhost:5183 · QR Order http://localhost:5184 ·
#           Admin http://localhost:5185 · PocketBase admin http://localhost:8095/_/
#
# หมายเหตุ: ย้ายพอร์ตทั้งชุดจากค่าเริ่มต้น (5173-5175, 8090) เป็น
# (5183-5185, 8095) เพราะชนกับคอนเทนเนอร์โปรเจกต์อื่นบนเครื่องนี้ —
# แก้ตรงกันทั้ง vite.config.ts ของแต่ละแอปและพอร์ตฝั่ง host ที่นี่
#
# โค้ด bind-mount จากเครื่องจริงเข้าคอนเทนเนอร์ แก้ไฟล์แล้ว Vite hot-reload
# ทันทีเหมือนรันตรงบนเครื่อง — ยกเว้น node_modules ที่แยกเป็น volume ของ
# คอนเทนเนอร์เอง เพราะ native binary ที่ npm install บน Windows/Mac ใช้กับ
# Linux ในคอนเทนเนอร์ไม่ได้ (เช่น esbuild) ต้องให้แต่ละฝั่งติดตั้งแยกกัน
#
# ตั้ง CHOKIDAR_USEPOLLING เพราะ Docker Desktop บน Windows บางครั้งไม่ส่ง
# inotify event ข้ามจาก host bind mount เข้าคอนเทนเนอร์ให้ Vite เห็นว่าไฟล์
# เปลี่ยน — polling ช้ากว่านิดหน่อยแต่ชัวร์กว่าเสมอ

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.21
    container_name: prakaipos-pb
    restart: unless-stopped
    ports:
      - '8095:8090'
    volumes:
      - ./backend/pb_data:/pb_data
      - ./backend/pb_migrations:/pb_migrations
      - ./backend/pb_hooks:/pb_hooks
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  pos:
    image: node:20-alpine
    container_name: prakaipos-dev-pos
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @prakaipos/pos -- --host 0.0.0.0"
    environment:
      - VITE_PB_URL=http://localhost:8095
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '5183:5183'
    volumes:
      - .:/app
      - pos_node_modules:/app/node_modules
    depends_on:
      pocketbase:
        condition: service_healthy

  order:
    image: node:20-alpine
    container_name: prakaipos-dev-order
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @prakaipos/order -- --host 0.0.0.0"
    environment:
      - VITE_PB_URL=http://localhost:8095
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '5184:5184'
    volumes:
      - .:/app
      - order_node_modules:/app/node_modules
    depends_on:
      pocketbase:
        condition: service_healthy

  admin:
    image: node:20-alpine
    container_name: prakaipos-dev-admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @prakaipos/admin -- --host 0.0.0.0"
    environment:
      - VITE_PB_URL=http://localhost:8095
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '5185:5185'
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pos_node_modules:
  order_node_modules:
  admin_node_modules:
